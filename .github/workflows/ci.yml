# Build a Docker image with compiled CUDA extensions via the reusable
# workflow in astera/att3ntion-builder.
#
# Security:
#   - pull_request from forks: GitHub does not expose secrets, so the
#     image build is skipped gracefully. Do NOT switch to pull_request_target.
#   - Environment protection rules on the "build" environment can require
#     reviewer approval before secrets are released.
#
# Required setup:
#   1. Create a "build" environment (Settings > Environments).
#   2. Add HARBOR_USERNAME and HARBOR_PASSWORD as environment secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-image:
    uses: astera/att3ntion-builder/.github/workflows/build.yml@main
    secrets: inherit
