[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "torch>=2.5",
]
build-backend = "setuptools.build_meta"

[project]
name = "att3ntion"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.4.0",
    "numpy>=1.24",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "scikit-learn>=1.7.2",
]

[tool.setuptools]
packages = ["att3ntion"]


[project.optional-dependencies]
cu130 = ["torch>=2.5"]
cu126 = ["torch>=2.5"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[dependency-groups]
dev = [
    "ninja>=1.13.0",
]

[tool.uv]
no-build-isolation-package = ["att3ntion"]
conflicts = [
    [
        { extra = "cu130" },
        { extra = "cu126" },
    ],
]

