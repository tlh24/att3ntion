[build-system]
requires = [
    "setuptools>=64",
    "wheel",
		"torch>=2.5",
]
build-backend = "setuptools.build_meta"

[project]
name = "att3ntion"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.4.0",
    "numpy>=1.24",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "scikit-learn>=1.7.2",
    "torch>=2.5",
]

[tool.setuptools]
packages = ["att3ntion"]


[project.optional-dependencies]
cu130 = []
cu124 = []

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "extra == 'cu130' and extra != 'cu124'" },
    { index = "pytorch-cu124", marker = "extra == 'cu124' and extra != 'cu130'" },
]

[tool.uv]
no-build-isolation-package = ["att3ntion"]
conflicts = [
    [
        { extra = "cu130" },
        { extra = "cu124" },
    ],
]

